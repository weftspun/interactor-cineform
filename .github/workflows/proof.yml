# The wire agreement gate. It builds the encoder and runs the proof, which includes the
# negative controls: a gate that only ever passes certifies a defect as readily as a fix.
name: proof
on: [push, pull_request]

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libuuid
        # cineform-sdk's EncoderSDK/StdAfx.h includes <uuid/uuid.h> on every non-Windows
        # target, and its own CMakeLists links -luuid under UNIX. The runner does not carry
        # the headers by default, so the first EncoderSDK file fails with
        # "fatal error: uuid/uuid.h: No such file or directory" and the eight after it do
        # too -- which reads as eight problems rather than one missing package.
        run: sudo apt-get update && sudo apt-get install -y uuid-dev
      - name: Fetch the pinned dependencies
        run: |
          set -eux
          # Revisions match default.xml. `repo` is not installed on the runner, so the
          # same four pins are cloned directly; a drift between this and the manifest is
          # a real risk and is why the shas are written out rather than tracking a branch.
          git clone --filter=blob:none --no-checkout https://github.com/v-sekai-fabric/contract-bus thirdparty/harness
          git -C thirdparty/harness checkout 4340ea34394e20b832d9efad66117cae2da2ce7a
          git clone --depth 1 --branch v1.6.1 https://github.com/laurencelundblade/QCBOR thirdparty/harness/libs/qcbor
          git clone --filter=blob:none --no-checkout https://github.com/weftspun/cineform-sdk thirdparty/cineform-sdk
          git -C thirdparty/cineform-sdk checkout 6b66f29b5079bfb708caa53ff4150616c11c5fa4
          git clone --filter=blob:none --no-checkout https://github.com/weftspun/libwebm thirdparty/libwebm
          git -C thirdparty/libwebm checkout 6184f4484a826724b5293837134ab9492261b941
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build --parallel
      - name: Prove the wire agreement
        run: ./build/cineform-proof-wire
